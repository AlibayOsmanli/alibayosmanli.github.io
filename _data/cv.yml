- title: Research Experience
  type: time_table
  contents:
    - title: PhD Researcher - World Models and Physical AI
      institution: Queen Mary University of London, London, UK
      year: "2025 - Present"
      description:
        - Develop test-time memory for long-video reasoning and repeated observations.
        - Co-developed a benchmark of 1,560 clips for physical video reasoning, with linked semantic, temporal and spatial targets.
        - Evaluated 10 video-language models across three prompt families and four video-input conditions.
        - Developed a rank-preserving method for verifying temporal retrieval predictions with multimodal evidence.

